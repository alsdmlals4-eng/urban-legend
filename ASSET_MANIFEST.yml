  - DIRECTION_APPROVED
  - PROJECT_ASSET_APPROVED
  - PRODUCTION_READY
  - IMPLEMENTED
  - RUNTIME_VERIFIED
  - VISUALLY_VALIDATED
  - PARTIAL_REFERENCE
  - SUPERSEDED
  - MIGRATION_PENDING
  - REJECTED

canonical_rules:
  one_active_path_per_asset: true
  preserve_history_in_git: true
  forbid_unapproved_replacement: true
  forbidden_active_name_tokens:
