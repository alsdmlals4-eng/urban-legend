name: Capture ANNUAL-MVP-001 Visual QA

on:
  pull_request:
    paths:
      - "tests/annual_mvp_001_visual_capture.gd"
      - "scripts/poc/annual_mvp_001/**"
      - "scenes/poc/annual_mvp_001/**"
      - ".github/workflows/capture-annual-mvp-001-visuals.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false
      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Import project
        run: godot --headless --path . --import
      - name: Capture QA screenshots
        env:
          ANNUAL_QA_OUTPUT: ${{ github.workspace }}/annual-qa-artifacts
        run: |
          set -o pipefail
          mkdir -p annual-qa-artifacts
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            godot --path . --rendering-driver opengl3 \
            --script res://tests/annual_mvp_001_visual_capture.gd \
            2>&1 | tee annual-visual-capture.log
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: annual-mvp-001-visual-qa
          path: |
            annual-qa-artifacts
            annual-visual-capture.log
          if-no-files-found: warn
          retention-days: 14
