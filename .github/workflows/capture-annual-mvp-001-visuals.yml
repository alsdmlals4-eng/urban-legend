name: Capture ANNUAL-MVP-001 Visual QA

on:
  pull_request:
    paths:
      - "tests/annual_mvp_001_visual_capture.gd"
      - "tests/annual_mvp_001_input_qa.gd"
      - "tests/annual_mvp_001_pointer_qa.gd"
      - "tests/annual_mvp_002_visual_capture.gd"
      - "tests/annual_mvp_002_pointer_qa.gd"
      - "scripts/poc/annual_mvp_001/**"
      - "scripts/poc/annual_mvp_002/**"
      - "scripts/ui/ui_theme_factory.gd"
      - "scenes/poc/annual_mvp_001/**"
      - "scenes/poc/annual_mvp_002/**"
      - ".github/workflows/capture-annual-mvp-001-visuals.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false
      - name: Install virtual display and Korean fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-noto-cjk
          fc-cache -f
      - name: Import project
        run: godot --headless --path . --import
      - name: Verify ANNUAL-MVP-001 keyboard focus and Esc flow
        run: |
          set -o pipefail
          timeout 90 xvfb-run -a -s "-screen 0 1280x720x24" \
            godot --path . --rendering-driver opengl3 \
            --script res://tests/annual_mvp_001_input_qa.gd \
            2>&1 | tee annual-input-qa.log
      - name: Verify ANNUAL-MVP-001 graphical pointer flow
        run: |
          set -o pipefail
          timeout 90 xvfb-run -a -s "-screen 0 1280x720x24" \
            godot --path . --rendering-driver opengl3 \
            --script res://tests/annual_mvp_001_pointer_qa.gd \
            2>&1 | tee annual-pointer-qa.log
      - name: Verify ANNUAL-MVP-002 graphical pointer flow
        run: |
          set -o pipefail
          timeout 120 xvfb-run -a -s "-screen 0 1280x720x24" \
            godot --path . --rendering-driver opengl3 \
            --script res://tests/annual_mvp_002_pointer_qa.gd \
            2>&1 | tee annual-mvp-002-pointer-qa.log
      - name: Capture ANNUAL-MVP-001 screenshots
        env:
          ANNUAL_QA_OUTPUT: ${{ github.workspace }}/annual-qa-artifacts/annual-mvp-001
        run: |
          set -o pipefail
          mkdir -p annual-qa-artifacts/annual-mvp-001
          timeout 120 xvfb-run -a -s "-screen 0 1920x1080x24" \
            godot --path . --rendering-driver opengl3 \
            --script res://tests/annual_mvp_001_visual_capture.gd \
            2>&1 | tee annual-visual-capture.log
      - name: Capture ANNUAL-MVP-002 screenshots
        env:
          ANNUAL_QA_OUTPUT: ${{ github.workspace }}/annual-qa-artifacts/annual-mvp-002
        run: |
          set -o pipefail
          mkdir -p annual-qa-artifacts/annual-mvp-002
          timeout 120 xvfb-run -a -s "-screen 0 1920x1080x24" \
            godot --path . --rendering-driver opengl3 \
            --script res://tests/annual_mvp_002_visual_capture.gd \
            2>&1 | tee annual-mvp-002-visual-capture.log
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: annual-mvp-001-002-visual-qa
          path: |
            annual-qa-artifacts
            annual-input-qa.log
            annual-pointer-qa.log
            annual-mvp-002-pointer-qa.log
            annual-visual-capture.log
            annual-mvp-002-visual-capture.log
          if-no-files-found: warn
          retention-days: 14
