name: Validate ANNUAL-MVP-001

on:
  pull_request:
    paths:
      - "data/poc/annual_mvp_001/**"
      - "scripts/poc/annual_mvp_001/**"
      - "scenes/poc/annual_mvp_001/**"
      - "scripts/poc/core_mvp_001/**"
      - "scripts/ui/main_menu.gd"
      - "tests/**"
      - "tools/ci/annual_mvp_001_core_tests.patch"
      - ".github/workflows/validate-annual-mvp-001.yml"
  workflow_dispatch:

concurrency:
  group: annual-mvp-001-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  annual-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Apply staged core extension red tests
        run: |
          if git apply --reverse --check tools/ci/annual_mvp_001_core_tests.patch >/dev/null 2>&1; then
            echo "Core extension red tests already applied."
          else
            git apply tools/ci/annual_mvp_001_core_tests.patch
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/core_mvp_001_state_test.gd tests/core_mvp_001_scene_test.gd
            git commit -m "test: define core session extension contract"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preserve core extension source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: annual-mvp-001-core-source
          path: |
            scripts/poc/core_mvp_001/core_mvp_001_state.gd
            scripts/poc/core_mvp_001/core_mvp_001_scene.gd
            tests/core_mvp_001_state_test.gd
            tests/core_mvp_001_scene_test.gd
          retention-days: 7
      - name: Run annual JSON contract
        run: python -m unittest tests/test_annual_mvp_001_data_contract.py -v
      - name: Setup Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false
      - name: Import project
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee annual-import.log
      - name: Run annual data loader test
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/annual_mvp_001_data_test.gd 2>&1 | tee annual-data.log
      - name: Run annual state machine test
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/annual_mvp_001_state_test.gd 2>&1 | tee annual-state.log
      - name: Run annual support resolver test
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/annual_mvp_001_support_resolver_test.gd 2>&1 | tee annual-support.log
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: annual-mvp-001-failure
          path: |
            annual-import.log
            annual-data.log
            annual-state.log
            annual-support.log
          if-no-files-found: warn
          retention-days: 7
