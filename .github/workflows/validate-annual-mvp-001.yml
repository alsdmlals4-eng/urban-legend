name: Validate ANNUAL-MVP-001

on:
  pull_request:
    paths:
      - "data/poc/annual_mvp_001/**"
      - "scripts/poc/annual_mvp_001/**"
      - "scenes/poc/annual_mvp_001/**"
      - "scripts/poc/core_mvp_001/**"
      - "scripts/ui/main_menu.gd"
      - "tests/**"
      - ".github/workflows/validate-annual-mvp-001.yml"
  workflow_dispatch:

concurrency:
  group: annual-mvp-001-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  annual-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run annual JSON contract
        run: python -m unittest tests/test_annual_mvp_001_data_contract.py -v
      - name: Setup Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false
      - name: Import project
        run: godot --headless --path . --import
      - name: Run annual data loader test
        run: godot --headless --path . --script res://tests/annual_mvp_001_data_test.gd
