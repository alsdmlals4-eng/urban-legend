name: Validate ANNUAL-MVP-001

on:
  pull_request:
    paths:
      - "data/poc/annual_mvp_001/**"
      - "data/poc/annual_mvp_002/**"
      - "scripts/poc/annual_mvp_001/**"
      - "scripts/poc/annual_mvp_002/**"
      - "scenes/poc/annual_mvp_001/**"
      - "scenes/poc/annual_mvp_002/**"
      - "scripts/poc/core_mvp_001/**"
      - "scripts/ui/main_menu.gd"
      - "tests/**"
      - "tools/review/**"
      - "TEST_CHECKLIST.md"
      - "MVP_ROADMAP.md"
      - "docs/CURRENT_STATUS.md"
      - "docs/CURRENT_HANDOFF.md"
      - ".github/workflows/validate-annual-mvp-001.yml"
  workflow_dispatch:

concurrency:
  group: annual-mvp-001-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  annual-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply approved cross-index disable once
        if: github.event_name == 'pull_request'
        run: |
          if grep -q 'DISABLED_PENDING_HYPOTHESIS_BOARD_HOOK' data/poc/annual_mvp_002/companion_equipment_research.json; then
            echo "Cross-index disable already applied"
            exit 0
          fi
          python tools/review/apply_cross_index_disable.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: disable cross-index until hypothesis-board hook"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Run annual and active-document Python contracts
        run: |
          python -m unittest \
            tests/test_annual_mvp_001_data_contract.py \
            tests/test_annual_mvp_002_data_contract.py \
            tests/test_annual_mvp_001_static_contract.py \
            tests/test_active_document_references.py -v
      - name: Setup Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false
      - name: Import project
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee annual-import.log
      - name: Run focused CORE-MVP-001 tests
        env:
          GODOT_BIN: godot
          GODOT_TEST_TMP: ${{ runner.temp }}/annual-mvp-001-core
        run: bash tests/run_core_mvp_001_tests.sh
      - name: Run focused ANNUAL-MVP-001 tests
        env:
          GODOT_BIN: godot
          GODOT_TEST_TMP: ${{ runner.temp }}/annual-mvp-001-focused
        run: bash tests/run_annual_mvp_001_tests.sh
      - name: Run focused ANNUAL-MVP-002 tests
        env:
          GODOT_BIN: godot
          GODOT_TEST_TMP: ${{ runner.temp }}/annual-mvp-002-focused
        run: bash tests/run_annual_mvp_002_tests.sh
      - name: Run full Godot regression
        env:
          GODOT_BIN: godot
          GODOT_TEST_TMP: ${{ runner.temp }}/annual-mvp-001-regression
        run: bash tests/run_godot_regression.sh
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: annual-mvp-001-failure
          path: |
            annual-import.log
            ${{ runner.temp }}/annual-mvp-001-core/focused-logs
            ${{ runner.temp }}/annual-mvp-001-focused/focused-logs
            ${{ runner.temp }}/annual-mvp-002-focused/focused-logs
            ${{ runner.temp }}/annual-mvp-001-regression/regression-logs
          if-no-files-found: warn
          retention-days: 7
