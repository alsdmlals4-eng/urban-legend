name: Validate ANNUAL-MVP-001

on:
  pull_request:
    paths:
      - "data/poc/annual_mvp_001/**"
      - "data/poc/annual_mvp_002/**"
      - "scripts/poc/annual_mvp_001/**"
      - "scripts/poc/annual_mvp_002/**"
      - "scenes/poc/annual_mvp_001/**"
      - "scenes/poc/annual_mvp_002/**"
      - "scripts/poc/core_mvp_001/**"
      - "scripts/core/validation_*.gd"
      - "data/episodes/episode_001_afterlife_station_canon_v2.json"
      - "data/migrations/afterlife_station_canon_v2_id_migration.json"
      - "scripts/data/afterlife_*.gd"
      - "scripts/core/afterlife_*.gd"
      - "scripts/core/monthly_state_policy.gd"
      - "scripts/core/m01_first_session_orchestrator.gd"
      - "scripts/core/m01_first_session_runtime_sync.gd"
      - "scripts/data/episode_loader.gd"
      - "scripts/ui/canon_v2_runtime_bridge.gd"
      - "scripts/ui/validation_entry_coordinator.gd"
      - "scripts/ui/main_menu.gd"
      - "project.godot"
      - "tests/**"
      - "tests/monthly_state/**"
      - "tests/first_session/**"
      - "tests/fixtures/afterlife_migration/**"
      - "tests/run_afterlife_canon_v2_migration_tests.sh"
      - "TEST_CHECKLIST.md"
      - "MVP_ROADMAP.md"
      - "docs/CURRENT_STATUS.md"
      - "docs/CURRENT_HANDOFF.md"
      - "docs/CURRENT_CONFIRMED_DECISIONS.md"
      - "docs/CURRENT_HANDOFF_VALIDATION.md"
      - "docs/GRILLME_APPROVAL_MERGE_LEDGER.md"
      - "docs/implementation/2026-08-02-package-2-main-menu-entry-routing-evidence.md"
      - ".github/workflows/validate-annual-mvp-001.yml"
  workflow_dispatch:

concurrency:
  group: annual-mvp-001-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  annual-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run annual and active-document Python contracts
        run: |
          python -m unittest \
            tests/test_annual_mvp_001_data_contract.py \
            tests/test_annual_mvp_002_data_contract.py \
            tests/test_annual_mvp_001_static_contract.py \
            tests/test_m01_first_session_runtime_wiring.py \
            tests/test_active_document_references.py -v
      - name: Setup Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false
      - name: Import project
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee annual-import.log
      - name: Run focused Validation Package 1 tests
        env:
          GODOT_BIN: godot
          GODOT_TEST_TMP: ${{ runner.temp }}/validation-package-1-focused
        run: bash tests/run_validation_package_1_tests.sh
      - name: Run focused Validation Package 2 tests
        env:
          GODOT_BIN: godot
          GODOT_TEST_TMP: ${{ runner.temp }}/validation-package-2-focused
        run: bash tests/run_validation_package_2_tests.sh
      - name: Run focused CORE-MVP-001 tests
        env:
          GODOT_BIN: godot
          GODOT_TEST_TMP: ${{ runner.temp }}/annual-mvp-001-core
        run: bash tests/run_core_mvp_001_tests.sh
      - name: Run focused ANNUAL-MVP-001 tests
        env:
          GODOT_BIN: godot
          GODOT_TEST_TMP: ${{ runner.temp }}/annual-mvp-001-focused
        run: bash tests/run_annual_mvp_001_tests.sh
      - name: Run focused ANNUAL-MVP-002 tests
        env:
          GODOT_BIN: godot
          GODOT_TEST_TMP: ${{ runner.temp }}/annual-mvp-002-focused
        run: bash tests/run_annual_mvp_002_tests.sh
      - name: Run focused Canon v2 migration suite
        env:
          GODOT_BIN: godot
          GODOT_TEST_TMP: ${{ runner.temp }}/afterlife-canon-v2-focused
        run: bash tests/run_afterlife_canon_v2_migration_tests.sh
      - name: Run full Godot regression
        env:
          GODOT_BIN: godot
          GODOT_TEST_TMP: ${{ runner.temp }}/annual-mvp-001-regression
          SKIP_AFTERLIFE_CANON_V2_FOCUSED: "1"
        run: bash tests/run_godot_regression.sh
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: annual-mvp-001-failure
          path: |
            annual-import.log
            ${{ runner.temp }}/validation-package-1-focused/focused-logs
            ${{ runner.temp }}/validation-package-2-focused/focused-logs
            ${{ runner.temp }}/annual-mvp-001-core/focused-logs
            ${{ runner.temp }}/annual-mvp-001-focused/focused-logs
            ${{ runner.temp }}/annual-mvp-002-focused/focused-logs
            ${{ runner.temp }}/afterlife-canon-v2-focused/afterlife-canon-v2-logs
            ${{ runner.temp }}/annual-mvp-001-regression/logs
          if-no-files-found: warn
          retention-days: 7
