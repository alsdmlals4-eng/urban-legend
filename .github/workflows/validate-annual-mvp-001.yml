name: Validate ANNUAL-MVP-001

on:
  pull_request:
    paths:
      - "data/poc/annual_mvp_001/**"
      - "scripts/poc/annual_mvp_001/**"
      - "scenes/poc/annual_mvp_001/**"
      - "scripts/poc/core_mvp_001/**"
      - "scripts/ui/main_menu.gd"
      - "tests/**"
      - "tools/ci/annual_mvp_001_*.patch"
      - "tools/ci/apply_annual_mvp_001_*.py"
      - ".github/workflows/validate-annual-mvp-001.yml"
  workflow_dispatch:

concurrency:
  group: annual-mvp-001-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  annual-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Apply staged implementation patches and scripts
        run: |
          changed=0
          for patch_file in tools/ci/annual_mvp_001_*.patch; do
            [ -f "$patch_file" ] || continue
            if git apply --reverse --check "$patch_file" >/dev/null 2>&1; then
              echo "$patch_file already applied"
              continue
            fi
            git apply "$patch_file"
            changed=1
          done
          for script_file in tools/ci/apply_annual_mvp_001_*.py; do
            [ -f "$script_file" ] || continue
            python "$script_file"
          done
          if ! git diff --quiet -- scripts tests scenes data; then
            changed=1
          fi
          if [ "$changed" -eq 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts tests scenes data
            git commit -m "feat: apply annual mvp implementation migration"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run annual Python contracts
        run: python -m unittest tests/test_annual_mvp_001_data_contract.py tests/test_annual_mvp_001_static_contract.py -v
      - name: Setup Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false
      - name: Import project
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee annual-import.log
      - name: Run focused CORE-MVP-001 tests
        env:
          GODOT_BIN: godot
          GODOT_TEST_TMP: ${{ runner.temp }}/annual-mvp-001-core
        run: bash tests/run_core_mvp_001_tests.sh
      - name: Run annual data loader test
        run: |
          set -o pipefail
          timeout 90 godot --headless --path . --script res://tests/annual_mvp_001_data_test.gd 2>&1 | tee annual-data.log
      - name: Run annual state machine test
        run: |
          set -o pipefail
          timeout 90 godot --headless --path . --script res://tests/annual_mvp_001_state_test.gd 2>&1 | tee annual-state.log
      - name: Run annual support resolver test
        run: |
          set -o pipefail
          timeout 90 godot --headless --path . --script res://tests/annual_mvp_001_support_resolver_test.gd 2>&1 | tee annual-support.log
      - name: Run annual incident adapter test
        run: |
          set -o pipefail
          timeout 90 godot --headless --path . --script res://tests/annual_mvp_001_incident_adapter_test.gd 2>&1 | tee annual-adapter.log
      - name: Run annual save test
        run: |
          set -o pipefail
          timeout 90 godot --headless --path . --script res://tests/annual_mvp_001_save_data_test.gd 2>&1 | tee annual-save.log
      - name: Run annual scene test
        run: |
          set -o pipefail
          timeout 90 godot --headless --path . --script res://tests/annual_mvp_001_scene_test.gd 2>&1 | tee annual-scene.log
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: annual-mvp-001-failure
          path: |
            annual-import.log
            annual-data.log
            annual-state.log
            annual-support.log
            annual-adapter.log
            annual-save.log
            annual-scene.log
            ${{ runner.temp }}/annual-mvp-001-core/focused-logs
          if-no-files-found: warn
          retention-days: 7
