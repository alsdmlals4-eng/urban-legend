name: Apply Base v9.4 Adoption
on:
  pull_request:
    paths:
      - "tools/apply_base_v9_4_adoption.py"
      - ".github/workflows/apply-base-v9-4-adoption.yml"
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python tools/apply_base_v9_4_adoption.py
      - run: python -m unittest tests.test_base_operating_sync tests.test_skill_package_integrity tests.test_base_v94_ai_operations_adoption -v
      - shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/PROJECT_BASE_ADAPTER.json skills/PROJECT_SKILL_SNAPSHOT.json skills/BASE_V9_ADAPTER.json skills/PROJECT_BASE_SKILL_ADAPTER.json skills/PROJECT_PATH_ADAPTER.json docs/BASE_RULES_VERSION.md docs/AI_WORKFLOW.md docs/UX_UI_SYSTEM.md docs/CURRENT_STATUS.md docs/DOCUMENTATION_MAP.md docs/reviews/2026-08-01_BASE_V9_4_ADOPTION_AUDIT.md tests/test_base_v94_ai_operations_adoption.py
          git commit -m "chore: adopt Base v9.4 operating contracts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
