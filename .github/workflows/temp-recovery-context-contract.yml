name: TEMP Recovery Context Contract
on:
  push:
    branches:
      - gpt/recovery-context-action-handoff-20260825
jobs:
  red-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5e2db70c4cbb096a941dcab0bc2f362749a96f83
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Require pre-implementation contract failure
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_recovery_context_action_contract.py > /tmp/recovery-red.log 2>&1
          code=$?
          cat /tmp/recovery-red.log
          if [ "$code" -eq 0 ]; then
            echo "Expected RED, but pre-implementation contract passed."
            exit 1
          fi
          grep -q "missing required authority" /tmp/recovery-red.log
  green-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Require successor contract success
        run: python -m pytest -q tests/test_recovery_context_action_contract.py
