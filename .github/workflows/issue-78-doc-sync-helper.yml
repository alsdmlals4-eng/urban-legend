              'PR #70의 4주 × 3슬롯 구현은 역사적 기준이며, 최신 7일 계약은 Issue #75 / PR #76에서 구현·자동 검증·병합을 완료했다. 문서 run #273, ANNUAL run #121, Visual run #51이 통과했다.',
