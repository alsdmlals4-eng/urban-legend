name: Issue 78 document synchronization helper

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  synchronize-active-documents:
    if: github.head_ref == 'agent/issue-78-doc-sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve and synchronize canonical planning information
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import os
          from pathlib import Path

          ROOT = Path('.')
          IMPLEMENTATION_COMMIT = '57c1f3d92e0fdae658826a23e5c2326fe9efe478'
          STATUS_COMMIT = '229c74a80b8aefd71d16befb95758f4dcc7f591f'
          PR_NUMBER = os.environ['PR_NUMBER']

          def replace_required(path: str, old: str, new: str, expected: int = 1) -> None:
              target = ROOT / path
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {count}: {old!r}')
              target.write_text(text.replace(old, new), encoding='utf-8')

          # PROJECT_CORE: active status, implementation evidence, and mutable time-budget terminology.
          replace_required(
              'docs/PROJECT_CORE.md',
              '> 연도제 구현: `ANNUAL-MVP-001 SEVEN_DAY_SCHEDULING_ON_BRANCH / CI_PENDING` — Issue #75  ',
              f'> 연도제 구현: `ANNUAL-MVP-001 SEVEN_DAY_SCHEDULING_MERGED / AUTOMATED_QA_PASSED` — Issue #75 / PR #76 / commit `{IMPLEMENTATION_COMMIT}`  ',
          )
          replace_required(
              'docs/PROJECT_CORE.md',
              '- 독립 PoC 저장 `annual-mvp-001-save-v1`과 본편 `mvp-039`·`mvp-038` 이관을 유지한다.\n- 사람 사용성·신규 플레이어 검증 전에는 `POC_PASSED`, 연도제 루프 통과, 제작 확대를 선언하지 않는다.',
              '- 독립 PoC 저장 `annual-mvp-001-save-v1`과 본편 `mvp-039`·`mvp-038` 이관을 유지한다.\n'
              f'- Issue #75 / PR #76 / commit `{IMPLEMENTATION_COMMIT}`에서 구현·병합했다.\n'
              '- 자동 검증은 문서 run #273, ANNUAL run #121, Visual run #51이 통과했다.\n'
              '- 사람 사용성·신규 플레이어 검증 전에는 `POC_PASSED`, 연도제 루프 통과, 제작 확대를 선언하지 않는다.',
          )
          replace_required(
              'docs/PROJECT_CORE.md',
              '- 분기별 주차와 주간 슬롯 수',
              '- 분기별 주차와 주간 시간 예산·일정별 일수 비용',
          )
          replace_required(
              'docs/PROJECT_CORE.md',
              '- 현재 작업: ANNUAL-MVP-001 4주 구조를 유지한 채 `7일 주간·가변 일정 일수` 계약으로 전환 중 — Issue #75',
