name: TEMP Generate Tool Hub v2 Identity Artifacts

on:
  pull_request:
    paths:
      - "tests/test_tool_hub_v2_identity.py"
      - ".github/workflows/tmp-generate-tool-hub-v2-identity.yml"
      - "skills/PROJECT_BASE_ADAPTER.json"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BASE_VALIDATOR_SHA: 19d936a3048115ab1bf8d94a6400d9bedbe09b2f
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check out merged Base validator
        uses: actions/checkout@v4
        with:
          repository: alsdmlals4-eng/Base
          ref: ${{ env.BASE_VALIDATOR_SHA }}
          path: .base-contract
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install -r .base-contract/.github/validation-requirements.txt

      - name: Generate canonical v2 adapter
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          tools = Path('.base-contract/tools').resolve()
          sys.path.insert(0, str(tools))
          import project_operating_contract as contract
          from base_release_index import install_release_lock_paths

          install_release_lock_paths(contract)
          path = Path('skills/PROJECT_BASE_ADAPTER.json')
          source = contract.load_object(path)
          migrated = contract.migrate_adapter_v1_to_v2(source, project_id='urban-legend')
          migrated['protected_baseline']['commit'] = os.environ['PR_BASE_SHA']
          path.write_bytes(contract.canonical_json(migrated))
          print(contract.hub_identity_state(migrated))
          PY

      - name: Generate Base-owned operating artifacts
        shell: bash
        run: |
          set -euo pipefail
          python .base-contract/tools/build_project_operating_artifacts.py \
            --project-root . \
            --base-repository .base-contract \
            --protected-base "$PR_BASE_SHA" \
            --write
          git diff --name-only > generated-files.txt
          cat generated-files.txt

      - name: Verify generated workspace
        shell: bash
        run: |
          set -euo pipefail
          python .base-contract/tools/check_project_operating_contract.py \
            --project-root . \
            --base-repository .base-contract \
            --protected-base "$PR_BASE_SHA" \
            --check
          python tests/test_tool_hub_v2_identity.py

      - name: Pin validator and publish generated outputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/validate-project-base-adapter.yml')
          text = path.read_text(encoding='utf-8')
          old = 'bfdc9e44d4a6920dc085eaa3f9d19d31b1acd2a1'
          new = '19d936a3048115ab1bf8d94a6400d9bedbe09b2f'
          if text.count(old) != 1:
              raise SystemExit(f'expected one old validator pin, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm -f .github/workflows/tmp-generate-tool-hub-v2-identity.yml generated-files.txt
          rm -rf .base-contract
          git add \
            skills/PROJECT_BASE_ADAPTER.json \
            skills/PROJECT_SKILL_SNAPSHOT.json \
            skills/BASE_V9_ADAPTER.json \
            skills/PROJECT_BASE_SKILL_ADAPTER.json \
            skills/PROJECT_PATH_ADAPTER.json \
            docs/PROJECT_OPERATING_DASHBOARD.html \
            .github/workflows/validate-project-base-adapter.yml \
            .github/workflows/tmp-generate-tool-hub-v2-identity.yml
          printf '%s\n' 'Staged migration changes:'
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "8"
          git config user.name 'Base Tool Hub IRG Bot'
          git config user.email 'base-tool-hub-irg@users.noreply.github.com'
          git commit -m 'fix: migrate Tool Hub project identity to v2'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
