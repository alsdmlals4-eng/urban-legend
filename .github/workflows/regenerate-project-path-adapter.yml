name: Regenerate project path adapter

on:
  push:
    branches:
      - agent/repair-base-adapter-wave-a
    paths:
      - .github/workflows/regenerate-project-path-adapter.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Check out trusted Base generator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alsdmlals4-eng/Base
          ref: bfdc9e44d4a6920dc085eaa3f9d19d31b1acd2a1
          path: .base-contract
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install generator dependencies
        run: python -m pip install -r .base-contract/.github/validation-requirements.txt
      - name: Regenerate owned views
        run: |
          python .base-contract/tools/build_project_operating_artifacts.py \
            --project-root . \
            --base-repository .base-contract \
            --protected-base f7edb459938bb5f3e2533ad828c2fe55019cd14b \
            --write
      - name: Commit path adapter only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/PROJECT_PATH_ADAPTER.json
          git diff --cached --check
          git commit -m "chore: regenerate project path adapter"
          git push origin HEAD:agent/repair-base-adapter-wave-a
