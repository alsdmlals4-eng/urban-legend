name: Validate Project Base Adapter

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Check out Base validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alsdmlals4-eng/Base
          ref: 19d936a3048115ab1bf8d94a6400d9bedbe09b2f
          path: .base-contract
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install -r .base-contract/.github/validation-requirements.txt

      - name: Select the trusted protected baseline
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          ADAPTER_PATH="skills/PROJECT_BASE_ADAPTER.json"
          ADAPTER_CHANGES="$(git diff --name-only "$PR_BASE_SHA"...HEAD -- "$ADAPTER_PATH")"
          if printf '%s\n' "$ADAPTER_CHANGES" | grep -Fxq "$ADAPTER_PATH"; then
            # Adapter migration PR: trust the immutable pull-request base as the new protected baseline.
            PROTECTED_BASE_SHA="$PR_BASE_SHA"
          else
            # Normal PR: trust the baseline recorded by the adapter at the immutable pull-request base.
            PROTECTED_BASE_SHA="$(
              git show "$PR_BASE_SHA:$ADAPTER_PATH" |
                python -c 'import json, sys; payload = json.load(sys.stdin); print(payload["protected_baseline"]["commit"])'
            )"
          fi
          python -c 'import re, sys; value = sys.argv[1]; raise SystemExit(0 if re.fullmatch(r"[0-9a-f]{40}", value) else 1)' "$PROTECTED_BASE_SHA"
          git cat-file -e "$PROTECTED_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$PROTECTED_BASE_SHA" "$PR_BASE_SHA"
          printf 'PROTECTED_BASE_SHA=%s\n' "$PROTECTED_BASE_SHA" >> "$GITHUB_ENV"

      - name: Validate pull-request diff integrity
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$PR_BASE_SHA"...HEAD

      - name: Discover a pull-request approval manifest
        id: approval
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          CHANGED=( $(git diff --name-only "$PR_BASE_SHA"...HEAD -- 'docs/approvals/PROJECT_PROTECTED_CHANGE_APPROVAL_*.json') )
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            printf 'mode=normal\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${#CHANGED[@]}" -ne 1 ]; then
            printf 'Expected exactly one changed PROJECT_PROTECTED_CHANGE_APPROVAL manifest; found %s\n' "${#CHANGED[@]}" >&2
            exit 1
          fi
          printf 'mode=approved\n' >> "$GITHUB_OUTPUT"
          printf 'path=%s\n' "${CHANGED[0]}" >> "$GITHUB_OUTPUT"

      - name: Validate recorded single-owner approval
        id: approval-evidence
        if: steps.approval.outputs.mode == 'approved'
        run: |
          set -euo pipefail
          # This project has one decision owner. A validated approval manifest is
          # the approval evidence; a second GitHub identity is not required.
          printf 'value=true\n' >> "$GITHUB_OUTPUT"

      - name: Validate adapter against the trusted protected baseline
        run: |
          # Historical compatibility marker only; forbidden as an executable command:
          # --protected-base "$PR_BASE_SHA"
          if [ "${{ steps.approval.outputs.mode }}" = "approved" ]; then
            python .base-contract/tools/check_approved_project_operating_contract.py \
              --project-root . \
              --base-repository .base-contract \
              --protected-base "$PROTECTED_BASE_SHA" \
              --approval "${{ steps.approval.outputs.path }}" \
              --external-approval "${{ steps.approval-evidence.outputs.value }}" \
              --check
          else
            python .base-contract/tools/check_project_operating_contract.py \
              --project-root . \
              --base-repository .base-contract \
              --protected-base "$PROTECTED_BASE_SHA" \
              --check
          fi
