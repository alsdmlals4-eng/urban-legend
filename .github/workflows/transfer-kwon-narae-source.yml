name: Transfer exact Kwon Narae anchor source

on:
  push:
    branches:
      - feat/kwon-narae-approved-anchor-20260816
    paths:
      - .github/workflows/transfer-kwon-narae-source.yml

permissions:
  contents: read

jobs:
  stage-exact-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact tracked source
        shell: bash
        run: |
          echo "94d35a4b992bf1a801117275f6b8f9862455ef7acdf6ecffe3ab880f727b0123  assets/source/mvp043_character_v1/kwon_narae.png" | sha256sum --check --strict
      - name: Upload exact source artifact
        uses: actions/upload-artifact@v4
        with:
          name: kwon-narae-approved-anchor-source
          path: assets/source/mvp043_character_v1/kwon_narae.png
          if-no-files-found: error
          compression-level: 0
