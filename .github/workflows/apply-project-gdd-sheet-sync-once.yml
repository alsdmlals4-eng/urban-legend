name: Apply Project GDD Sheet Sync Once
on:
  pull_request:
    branches: [main]
    paths: ["tools/fix_urban_base_bca_sync_once.py", ".github/workflows/apply-project-gdd-sheet-sync-once.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python tools/fix_urban_base_bca_sync_once.py
      - run: |
          python -m unittest \
            tests.test_base_operating_sync \
            tests.test_skill_package_integrity \
            tests.test_bca_visual_sheet_adoption -v
          git diff --check
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/BASE_RULES_VERSION.md skills/SKILL_REGISTRY.json skills/BASE_SKILL_INDEX.json skills/BASE_SKILL_COVERAGE.json skills/PROJECT_PATH_ADAPTER.json skills/disciplines/urban-legend-qa/SKILL.md tests/test_base_operating_sync.py
          git commit -m "docs: align Urban Legend Base and BCA contracts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
