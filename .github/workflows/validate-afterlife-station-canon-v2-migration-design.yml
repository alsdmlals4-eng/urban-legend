name: Validate Afterlife Station Canon v2 Migration

on:
  pull_request:
    paths:
      - "data/episodes/episode_001_afterlife_station_canon_v2.json"
      - "data/migrations/afterlife_station_canon_v2_id_migration.json"
      - "scripts/data/afterlife_*.gd"
      - "scripts/core/afterlife_*.gd"
      - "scripts/data/episode_loader.gd"
      - "scripts/core/game_state.gd"
      - "scripts/core/validation_save_repository.gd"
      - "scripts/core/validation_session.gd"
      - "project.godot"
      - "tests/afterlife_migration/**"
      - "tests/run_afterlife_canon_v2_migration_tests.sh"
      - "docs/decisions/D-2026-08-05-AFTERLIFE-STATION-CANON-V2-MIGRATION-DESIGN.md"
      - "docs/decisions/D-2026-08-05-WORKFLOW-BENCHMARK-TDD-AND-CHECKPOINT-POLICY.md"
      - "docs/superpowers/specs/2026-08-05-afterlife-station-canon-v2-migration-design.md"
      - "docs/superpowers/plans/2026-08-05-afterlife-station-canon-v2-migration-implementation-plan.md"
      - "docs/superpowers/plans/2026-08-05-afterlife-station-canon-v2-migration-plan-adversarial-review-addendum.md"
      - "docs/planning/2026-08-05-afterlife-station-id-migration-matrix.md"
      - "tests/test_afterlife_station_canon_v2_migration_design.py"
      - "tests/test_afterlife_station_canon_v2_implementation_plan.py"
      - ".github/workflows/validate-afterlife-station-canon-v2-migration-design.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate migration design and implementation plan contracts
        run: |
          python -m unittest tests/test_afterlife_station_canon_v2_migration_design.py
          python -m unittest tests/test_afterlife_station_canon_v2_implementation_plan.py
      - name: Setup Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false
      - name: Import project
        run: godot --headless --path . --import
      - name: Run Canon v2 loader contract
        env:
          HOME: ${{ runner.temp }}/afterlife-canon-v2-loader-home
          XDG_DATA_HOME: ${{ runner.temp }}/afterlife-canon-v2-loader-xdg
        run: godot --headless --path . --script res://tests/afterlife_migration/afterlife_canon_v2_loader_test.gd
      - name: Run ID migration registry contract
        env:
          HOME: ${{ runner.temp }}/afterlife-id-registry-home
          XDG_DATA_HOME: ${{ runner.temp }}/afterlife-id-registry-xdg
        run: godot --headless --path . --script res://tests/afterlife_migration/afterlife_id_migration_registry_test.gd
      - name: Run legacy save inspector contract
        env:
          HOME: ${{ runner.temp }}/afterlife-save-inspector-home
          XDG_DATA_HOME: ${{ runner.temp }}/afterlife-save-inspector-xdg
        run: godot --headless --path . --script res://tests/afterlife_migration/afterlife_legacy_save_inspector_test.gd
      - name: Run main save migrator contract
        env:
          HOME: ${{ runner.temp }}/afterlife-main-migrator-home
          XDG_DATA_HOME: ${{ runner.temp }}/afterlife-main-migrator-xdg
        run: godot --headless --path . --script res://tests/afterlife_migration/afterlife_main_save_migrator_test.gd
      - name: Run Validation save migrator contract
        env:
          HOME: ${{ runner.temp }}/afterlife-validation-migrator-home
          XDG_DATA_HOME: ${{ runner.temp }}/afterlife-validation-migrator-xdg
        run: godot --headless --path . --script res://tests/afterlife_migration/afterlife_validation_save_migrator_test.gd
      - name: Run two-phase migration transaction contract
        env:
          HOME: ${{ runner.temp }}/afterlife-transaction-home
          XDG_DATA_HOME: ${{ runner.temp }}/afterlife-transaction-xdg
        run: godot --headless --path . --script res://tests/afterlife_migration/afterlife_migration_transaction_test.gd
      - name: Run main and Validation migration integration contract
        env:
          HOME: ${{ runner.temp }}/afterlife-integration-home
          XDG_DATA_HOME: ${{ runner.temp }}/afterlife-integration-xdg
        run: godot --headless --path . --script res://tests/afterlife_migration/afterlife_migration_integration_test.gd
