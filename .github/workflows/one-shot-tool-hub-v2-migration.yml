name: One-shot Tool Hub v2 migration

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'ops/tool-hub-v2-system-validation-20260817'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out migration branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Check out verified Base validator and generator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alsdmlals4-eng/Base
          ref: 19d936a3048115ab1bf8d94a6400d9bedbe09b2f
          path: .base-contract
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install validator dependencies
        run: python -m pip install -r .base-contract/.github/validation-requirements.txt

      - name: Migrate canonical adapter and validator pin
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('.base-contract/tools').resolve()))
          import project_operating_contract as contract
          from base_release_index import install_release_lock_paths

          install_release_lock_paths(contract)
          adapter_path = Path('skills/PROJECT_BASE_ADAPTER.json')
          adapter = json.loads(adapter_path.read_text(encoding='utf-8'))
          if adapter.get('schema_version') == 1:
              adapter = contract.migrate_adapter_v1_to_v2(adapter, project_id='urban-legend')
          elif adapter.get('schema_version') == 2:
              if adapter.get('project', {}).get('project_id') != 'urban-legend':
                  raise SystemExit('unexpected v2 project_id')
          else:
              raise SystemExit(f"unsupported schema_version: {adapter.get('schema_version')!r}")

          adapter['protected_baseline']['commit'] = os.environ['PR_BASE_SHA']
          adapter_path.write_bytes(contract.canonical_json(adapter))

          workflow_path = Path('.github/workflows/validate-project-base-adapter.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          old = 'bfdc9e44d4a6920dc085eaa3f9d19d31b1acd2a1'
          new = '19d936a3048115ab1bf8d94a6400d9bedbe09b2f'
          if old not in workflow and new not in workflow:
              raise SystemExit('expected Base validator pin not found')
          workflow_path.write_text(workflow.replace(old, new), encoding='utf-8')
          PY

      - name: Regenerate canonical operating artifacts
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python .base-contract/tools/build_project_operating_artifacts.py \
            --project-root . \
            --base-repository .base-contract \
            --protected-base "$PR_BASE_SHA" \
            --write
          python .base-contract/tools/check_project_operating_contract.py \
            --project-root . \
            --base-repository .base-contract \
            --protected-base "$PR_BASE_SHA" \
            --check

      - name: Remove one-shot workflow and commit generated migration
        run: |
          rm .github/workflows/one-shot-tool-hub-v2-migration.yml
          git config user.name 'Base Tool Hub Migration'
          git config user.email 'base-tool-hub-migration@example.invalid'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git commit -m 'ops: migrate urban-legend Tool Hub identity to v2'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
