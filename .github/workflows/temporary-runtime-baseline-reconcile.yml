name: Temporary Runtime Baseline Reconcile

on:
  pull_request:
    paths:
      - ".github/workflows/temporary-runtime-baseline-reconcile.yml"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Check out pinned Base generator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alsdmlals4-eng/Base
          ref: 19d936a3048115ab1bf8d94a6400d9bedbe09b2f
          path: .base-contract
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install -r .base-contract/.github/validation-requirements.txt

      - name: Commit trusted baseline input
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("skills/PROJECT_BASE_ADAPTER.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          payload["protected_baseline"]["commit"] = os.environ["PR_BASE_SHA"]
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/PROJECT_BASE_ADAPTER.json
          git commit -m "chore: reconcile protected runtime baseline"

      - name: Generate official Base operating views
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python .base-contract/tools/build_project_operating_artifacts.py \
            --project-root . \
            --base-repository .base-contract \
            --protected-base "$PR_BASE_SHA" \
            --write
          python .base-contract/tools/build_project_operating_artifacts.py \
            --project-root . \
            --base-repository .base-contract \
            --protected-base "$PR_BASE_SHA" \
            --check
          git status --short
          git add \
            skills/PROJECT_SKILL_SNAPSHOT.json \
            docs/PROJECT_OPERATING_DASHBOARD.html \
            skills/BASE_V9_ADAPTER.json \
            skills/PROJECT_BASE_SKILL_ADAPTER.json \
            skills/PROJECT_PATH_ADAPTER.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh generated Base operating views"
          fi

      - name: Push generated successor
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: git push origin "HEAD:$HEAD_REF"
